[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-acp-openai-proxy"
version = "1.0.0"
description = "OpenAI-compatible HTTP proxy API backed by Antigravity Agent Client Protocol (ACP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "openai>=1.0.0",
]

[project.scripts]
antigravity-acp-proxy = "antigravity_proxy.main:main"
